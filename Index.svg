<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;top:0;left:0;width:100%;height:100%;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" id="f" title="Nebula" style="border:0;display:block;width:100%;height:100%;background:#05040a;"></iframe>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
    fetch("https://cdn.jsdelivr.net/gh/Lego611091/Nebula-Bypass@main/app.html")
      .then(function (r) { return r.text(); })
      .then(function (html) { document.getElementById("f").srcdoc = html; })
      .catch(function (e) { document.getElementById("f").srcdoc = "<body style='background:#05040a;color:#fff;font-family:sans-serif'>Failed to load: " + e + "</body>"; });
  ]]></script>
</svg>
